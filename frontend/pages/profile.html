<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Saturday</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .profile-hero { text-align:center;padding:30px 0 20px; }
    .profile-avatar-wrap { position:relative;display:inline-block;margin-bottom:16px; }
    .profile-avatar { width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:#000;border:3px solid rgba(255,184,0,0.4);overflow:hidden;margin:0 auto; }
    .profile-avatar img { width:100%;height:100%;object-fit:cover; }
    .change-avatar-btn { position:absolute;bottom:0;right:0;width:28px;height:28px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;border:2px solid var(--bg-primary); }
    .profile-name { font-size:22px;font-weight:800; }
    .profile-phone { font-size:14px;color:var(--text-secondary);margin-top:4px; }
    .info-row { display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border); }
    .info-row:last-child { border-bottom:none; }
    .info-label { font-size:13px;color:var(--text-muted);font-weight:600; }
    .info-val { font-size:14px;font-weight:500; }
  </style>
</head>
<body>
  <script src="../js/layout.js"></script>
  <main class="page-wrapper">
    <div class="container">
      <div class="page-title-bar"><h1 class="page-title">👤 Profile</h1></div>
      <div class="profile-hero fade-in">
        <div class="profile-avatar-wrap">
          <div class="profile-avatar" id="profileAvatar">S</div>
          <label class="change-avatar-btn" for="avatarInput" title="Change photo">📷</label>
          <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="changeAvatar(this)">
        </div>
        <div class="profile-name" id="profileName">Loading...</div>
        <div class="profile-phone" id="profilePhone">---</div>
        <div style="margin-top:10px;" id="profileStatus"></div>
      </div>
      <div class="card fade-in">
        <div id="profileInfo">
          <div style="text-align:center;padding:20px;"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </main>
  <script src="../js/main.js"></script>
  <script>if(!localStorage.getItem('sat_token')){window.location.replace('../index.html');}</script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      loadUserAvatar();
      try {
        const data = await API.get('/user/profile');
        document.getElementById('profileName').textContent = data.name;
        document.getElementById('profilePhone').textContent = data.phone;
        document.getElementById('profileStatus').innerHTML = `<span class="badge badge-${data.isActive?'green':'red'}">${data.isActive?'✅ Active':'🔴 Not Active'}</span>`;
        const avatarEl = document.getElementById('profileAvatar');
        if (data.avatar) { avatarEl.innerHTML = `<img src="${data.avatar}" alt="Avatar">`; }
        else { avatarEl.textContent = data.name.charAt(0).toUpperCase(); }
        document.getElementById('profileInfo').innerHTML = `
          <div class="info-row"><span class="info-label">Full Name</span><span class="info-val">${data.name}</span></div>
          <div class="info-row"><span class="info-label">Username</span><span class="info-val">@${data.username}</span></div>
          <div class="info-row"><span class="info-label">Phone</span><span class="info-val">${data.phone}</span></div>
          <div class="info-row"><span class="info-label">Email</span><span class="info-val">${data.email}</span></div>
          <div class="info-row"><span class="info-label">Balance</span><span class="info-val" style="color:var(--gold);font-weight:700;">${formatAmount(data.balance)}</span></div>
          <div class="info-row"><span class="info-label">VIP Level</span><span class="info-val">${data.vipLevel?'VIP '+data.vipLevel:'No VIP'}</span></div>
          <div class="info-row"><span class="info-label">Referral Code</span><span class="info-val" style="color:var(--gold);font-family:monospace;">${data.referralCode}</span></div>
          <div class="info-row"><span class="info-label">Joined</span><span class="info-val">${formatDate(data.createdAt)}</span></div>`;
      } catch (err) {
        document.getElementById('profileInfo').innerHTML = `<div class="empty-state"><div class="empty-text">${err.message}</div></div>`;
      }
    });

    function changeAvatar(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result;
        try {
          await API.post('/user/avatar', { avatar: base64 });
          document.getElementById('profileAvatar').innerHTML = `<img src="${base64}" alt="Avatar">`;
          const user = Auth.getUser();
          user.avatar = base64;
          Storage.set('sat_user', user);
          Toast.success('Profile photo updated!');
        } catch (err) { Toast.error(err.message); }
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
